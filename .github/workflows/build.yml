name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ---- 固定 debug 签名 ----
      #
      # 为什么需要：GitHub 的 runner 每次都是全新机器，Android 插件会在
      # ~/.android/debug.keystore 现场生成一个 debug 证书 —— **每次都不一样**。
      # 签名不同的 APK 无法覆盖安装，Android 报
      #   INSTALL_FAILED_UPDATE_INCOMPATIBLE
      # 用户只能"先卸载再安装"，数据全丢。
      #
      # 做法：仓库 secret `DEBUG_KEYSTORE_B64` 存一份固定 keystore 的 base64，
      # 这里解出来放到 ~/.android/debug.keystore，Android 插件会自动复用它。
      #
      # 没配 secret 时**不失败**，只是回到旧的"每次新证书"行为（仍然能出包）。
      - name: Restore stable debug keystore (optional)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::未配置 DEBUG_KEYSTORE_B64，本次 APK 的签名与上次不同，安装时可能需要先卸载"
            exit 0
          fi
          # 放到**工作区内**的固定路径，而不是 ~/.android/debug.keystore。
          #
          # 为什么不放 ~/.android：AGP 的默认 debug 签名配置是"如果文件不存在或
          # 内容不是它内置的那份就直接重新生成"，实测把正确 keystore 放进去后
          # 打出来的 APK 证书依然是另一个指纹（2666 字节的 keystore 确实恢复了，
          # 但签名用的不是它）。所以改成和本地构建**同一条路径**：
          # 写 local.properties 让 build.gradle.kts 的 localDebug signingConfig 生效。
          KEYSTORE_PATH="$GITHUB_WORKSPACE/ci-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          echo "已恢复固定 debug keystore（$(stat -c%s "$KEYSTORE_PATH") 字节）"
          # local.properties 一旦存在，AGP 就不再看 ANDROID_HOME —— sdk.dir 必须一起写
          printf 'sdk.dir=%s\nvte.keystore.path=%s\n' "$ANDROID_HOME" "$KEYSTORE_PATH" > local.properties
          echo "local.properties: $(cat local.properties)"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # 单元测试。开发机没有 JDK，这是唯一能"真跑"验证逻辑的环节 ——
      # 别把它并进 assembleDebug，失败时要能一眼分清是编译挂了还是测试挂了。
      #
      # timeout-minutes：曾经有一次测试用了普通 runTest scope + 引擎的无限 tick 循环，
      # CI 上表现为这一步**永远 in_progress**（不是报错），要等 6 小时才超时。
      # 加一个硬上限，让"挂住"变成一次快速的失败。
      - name: Run unit tests
        timeout-minutes: 10
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      # 单测用的是内存假 DAO，**不会执行 Room 的 @Query SQL**。
      # 这个脚本把真实 SQL 与真实迁移语句放到真实 SQLite 上跑一遍，
      # 覆盖「SQL 写错」和「迁移跑不通」这两类单测抓不到的问题。
      - name: Verify archive DB (real SQLite)
        timeout-minutes: 5
        run: python3 tools/verify_archive_db.py

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: visual-timer-ext-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload mapping/report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: app/build/reports/**
          if-no-files-found: ignore
