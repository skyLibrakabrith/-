name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # 单元测试。开发机没有 JDK，这是唯一能"真跑"验证逻辑的环节 ——
      # 别把它并进 assembleDebug，失败时要能一眼分清是编译挂了还是测试挂了。
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: visual-timer-ext-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload mapping/report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: app/build/reports/**
          if-no-files-found: ignore
