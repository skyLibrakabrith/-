name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ---- 固定 debug 签名 ----
      #
      # 为什么需要：GitHub 的 runner 每次都是全新机器，Android 插件会在
      # ~/.android/debug.keystore 现场生成一个 debug 证书 —— **每次都不一样**。
      # 签名不同的 APK 无法覆盖安装，Android 报
      #   INSTALL_FAILED_UPDATE_INCOMPATIBLE
      # 用户只能"先卸载再安装"，数据全丢。
      #
      # 做法：仓库 secret `DEBUG_KEYSTORE_B64` 存一份固定 keystore 的 base64，
      # 这里解出来放到 ~/.android/debug.keystore，Android 插件会自动复用它。
      #
      # 没配 secret 时**不失败**，只是回到旧的"每次新证书"行为（仍然能出包）。
      - name: Restore stable debug keystore (optional)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::未配置 DEBUG_KEYSTORE_B64，本次 APK 的签名与上次不同，安装时可能需要先卸载"
            exit 0
          fi
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "已恢复固定 debug keystore（$(stat -c%s ~/.android/debug.keystore) 字节）"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # 单元测试。开发机没有 JDK，这是唯一能"真跑"验证逻辑的环节 ——
      # 别把它并进 assembleDebug，失败时要能一眼分清是编译挂了还是测试挂了。
      #
      # timeout-minutes：曾经有一次测试用了普通 runTest scope + 引擎的无限 tick 循环，
      # CI 上表现为这一步**永远 in_progress**（不是报错），要等 6 小时才超时。
      # 加一个硬上限，让"挂住"变成一次快速的失败。
      - name: Run unit tests
        timeout-minutes: 10
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: visual-timer-ext-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload mapping/report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: app/build/reports/**
          if-no-files-found: ignore
